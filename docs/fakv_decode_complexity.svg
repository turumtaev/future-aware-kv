<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Future-aware KV decode connections</title>
  <desc id="desc">Input, source, and target rows. Gray lines show earlier work. For the final token, red lines connect the new input to old sources, green lines connect the visible inputs to the new source, and blue lines connect visible sources to the new target.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .node { fill: #ffffff; stroke: #57606a; stroke-width: 1.6; rx: 10; }
    .node-label { font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .row-label { font-size: 17px; font-weight: 650; text-anchor: end; dominant-baseline: middle; }
    .prefix { fill: none; stroke-dasharray: 4 7; }
    .prior { fill: none; stroke-width: 1.2; }
    .current { fill: none; stroke-width: 2.3; stroke-linecap: round; }
  </style>

  <rect x="1" y="1" width="898" height="538" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Successive visible prefixes, from light to dark. -->
  <rect class="prefix" x="170" y="50" width="80" height="424" rx="12" stroke="#d8dee4" stroke-width="1.1"/>
  <rect class="prefix" x="160" y="44" width="210" height="436" rx="12" stroke="#b7bec7" stroke-width="1.2"/>
  <rect class="prefix" x="150" y="38" width="340" height="448" rx="12" stroke="#8c959f" stroke-width="1.3"/>
  <rect class="prefix" x="140" y="32" width="530" height="460" rx="12" stroke="#656d76" stroke-width="1.5"/>
  <rect class="prefix" x="130" y="26" width="700" height="472" rx="12" stroke="#24292f" stroke-width="2"/>

  <text class="row-label" x="112" y="90">target</text>
  <text class="row-label" x="112" y="260">source</text>
  <text class="row-label" x="112" y="430">input</text>

  <!-- Work already completed for earlier targets. -->
  <g class="prior" stroke="#d8dee4">
    <line x1="210" y1="408" x2="210" y2="282"/>
    <line x1="210" y1="238" x2="210" y2="112"/>
  </g>
  <g class="prior" stroke="#b7bec7">
    <line x1="330" y1="408" x2="210" y2="282"/>
    <line x1="210" y1="408" x2="330" y2="282"/>
    <line x1="330" y1="408" x2="330" y2="282"/>
    <line x1="210" y1="238" x2="330" y2="112"/>
    <line x1="330" y1="238" x2="330" y2="112"/>
  </g>
  <g class="prior" stroke="#8c959f">
    <line x1="450" y1="408" x2="210" y2="282"/>
    <line x1="450" y1="408" x2="330" y2="282"/>
    <line x1="210" y1="408" x2="450" y2="282"/>
    <line x1="330" y1="408" x2="450" y2="282"/>
    <line x1="450" y1="408" x2="450" y2="282"/>
    <line x1="210" y1="238" x2="450" y2="112"/>
    <line x1="330" y1="238" x2="450" y2="112"/>
    <line x1="450" y1="238" x2="450" y2="112"/>
  </g>
  <g class="prior" stroke="#656d76">
    <line x1="630" y1="408" x2="210" y2="282"/>
    <line x1="630" y1="408" x2="330" y2="282"/>
    <line x1="630" y1="408" x2="450" y2="282"/>
    <line x1="210" y1="408" x2="630" y2="282"/>
    <line x1="330" y1="408" x2="630" y2="282"/>
    <line x1="450" y1="408" x2="630" y2="282"/>
    <line x1="630" y1="408" x2="630" y2="282"/>
    <line x1="210" y1="238" x2="630" y2="112"/>
    <line x1="330" y1="238" x2="630" y2="112"/>
    <line x1="450" y1="238" x2="630" y2="112"/>
    <line x1="630" y1="238" x2="630" y2="112"/>
  </g>

  <!-- Work added by token T. -->
  <g class="current" stroke="#d73a49">
    <line x1="790" y1="408" x2="210" y2="282"/>
    <line x1="790" y1="408" x2="330" y2="282"/>
    <line x1="790" y1="408" x2="450" y2="282"/>
    <line x1="790" y1="408" x2="630" y2="282"/>
  </g>
  <g class="current" stroke="#238636">
    <line x1="210" y1="408" x2="790" y2="282"/>
    <line x1="330" y1="408" x2="790" y2="282"/>
    <line x1="450" y1="408" x2="790" y2="282"/>
    <line x1="630" y1="408" x2="790" y2="282"/>
    <line x1="790" y1="408" x2="790" y2="282"/>
  </g>
  <g class="current" stroke="#0969da">
    <line x1="210" y1="238" x2="790" y2="112"/>
    <line x1="330" y1="238" x2="790" y2="112"/>
    <line x1="450" y1="238" x2="790" y2="112"/>
    <line x1="630" y1="238" x2="790" y2="112"/>
    <line x1="790" y1="238" x2="790" y2="112"/>
  </g>

  <!-- Nodes are drawn last so dense line endpoints stay clean. -->
  <g>
    <rect class="node" x="180" y="68" width="60" height="44"/>
    <rect class="node" x="300" y="68" width="60" height="44"/>
    <rect class="node" x="420" y="68" width="60" height="44"/>
    <rect class="node" x="600" y="68" width="60" height="44"/>
    <rect x="760" y="68" width="60" height="44" rx="10" fill="#f0f7ff" stroke="#0969da" stroke-width="2.4"/>
    <text class="node-label" x="210" y="90">1</text>
    <text class="node-label" x="330" y="90">2</text>
    <text class="node-label" x="450" y="90">3</text>
    <text class="node-label" x="630" y="90">T−1</text>
    <text class="node-label" x="790" y="90">T</text>
    <text x="540" y="96" text-anchor="middle" font-size="25" fill="#656d76">⋯</text>
  </g>
  <g>
    <rect class="node" x="180" y="238" width="60" height="44"/>
    <rect class="node" x="300" y="238" width="60" height="44"/>
    <rect class="node" x="420" y="238" width="60" height="44"/>
    <rect class="node" x="600" y="238" width="60" height="44"/>
    <rect x="760" y="238" width="60" height="44" rx="10" fill="#f0fff4" stroke="#238636" stroke-width="2.4"/>
    <text class="node-label" x="210" y="260">1</text>
    <text class="node-label" x="330" y="260">2</text>
    <text class="node-label" x="450" y="260">3</text>
    <text class="node-label" x="630" y="260">T−1</text>
    <text class="node-label" x="790" y="260">T</text>
    <text x="540" y="266" text-anchor="middle" font-size="25" fill="#656d76">⋯</text>
  </g>
  <g>
    <rect class="node" x="180" y="408" width="60" height="44"/>
    <rect class="node" x="300" y="408" width="60" height="44"/>
    <rect class="node" x="420" y="408" width="60" height="44"/>
    <rect class="node" x="600" y="408" width="60" height="44"/>
    <rect x="760" y="408" width="60" height="44" rx="10" fill="#fff5f5" stroke="#d73a49" stroke-width="2.4"/>
    <text class="node-label" x="210" y="430">1</text>
    <text class="node-label" x="330" y="430">2</text>
    <text class="node-label" x="450" y="430">3</text>
    <text class="node-label" x="630" y="430">T−1</text>
    <text class="node-label" x="790" y="430">T</text>
    <text x="540" y="436" text-anchor="middle" font-size="25" fill="#656d76">⋯</text>
  </g>
</svg>
